<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" shape-rendering="crispEdges">
  <!-- Retro 1-bit Pixel Art Avatar for Veerakumar V -->
  <rect width="64" height="64" fill="#000000" />
  
  <!-- Outer Dither & Border -->
  <rect x="2" y="2" width="60" height="60" fill="none" stroke="#ffffff" stroke-width="2" />
  <rect x="5" y="5" width="54" height="54" fill="#111111" />
  
  <!-- Hair & Head Outline -->
  <rect x="22" y="10" width="20" height="4" fill="#ffffff" />
  <rect x="18" y="14" width="28" height="4" fill="#ffffff" />
  <rect x="16" y="18" width="8" height="10" fill="#ffffff" />
  <rect x="40" y="18" width="8" height="10" fill="#ffffff" />
  
  <!-- Face Canvas -->
  <rect x="22" y="18" width="20" height="18" fill="#ffffff" />
  
  <!-- Retro Glasses / Eyes -->
  <rect x="22" y="22" width="8" height="6" fill="#000000" />
  <rect x="34" y="22" width="8" height="6" fill="#000000" />
  <rect x="30" y="24" width="4" height="2" fill="#000000" />
  <!-- Glass Glint / Pixels -->
  <rect x="24" y="24" width="2" height="2" fill="#ffffff" />
  <rect x="36" y="24" width="2" height="2" fill="#ffffff" />

  <!-- Nose & Smile / Beard -->
  <rect x="31" y="29" width="2" height="2" fill="#000000" />
  <rect x="28" y="32" width="8" height="2" fill="#000000" />
  <rect x="26" y="34" width="12" height="2" fill="#000000" />

  <!-- Neck & Collar -->
  <rect x="28" y="36" width="8" height="4" fill="#ffffff" />
  
  <!-- Jacket / Gamer Hoodie -->
  <rect x="16" y="40" width="32" height="16" fill="#ffffff" />
  <rect x="20" y="40" width="24" height="16" fill="#000000" />
  <!-- Shirt & Tie/Pattern -->
  <rect x="28" y="40" width="8" height="16" fill="#ffffff" />
  <rect x="31" y="42" width="2" height="14" fill="#000000" />
  <!-- Shoulder epaulets -->
  <rect x="12" y="44" width="6" height="12" fill="#ffffff" />
  <rect x="46" y="44" width="6" height="12" fill="#ffffff" />

  <!-- Code/Terminal Glint -->
  <rect x="6" y="6" width="4" height="2" fill="#ffffff" />
  <rect x="54" y="6" width="4" height="2" fill="#ffffff" />
  <rect x="6" y="56" width="4" height="2" fill="#ffffff" />
  <rect x="54" y="56" width="4" height="2" fill="#ffffff" />
</svg>
