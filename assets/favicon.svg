<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Retro Game Cartridge Favicon -->
  <rect width="32" height="32" fill="#000000" />
  <rect x="2" y="2" width="28" height="28" fill="#ffffff" />
  <rect x="4" y="4" width="24" height="24" fill="#000000" />
  <!-- Cartridge notch & label -->
  <rect x="6" y="6" width="20" height="12" fill="#ffffff" />
  <rect x="8" y="8" width="16" height="8" fill="#000000" />
  <!-- Pixel 'V' on cartridge -->
  <rect x="10" y="9" width="2" height="3" fill="#ffffff" />
  <rect x="20" y="9" width="2" height="3" fill="#ffffff" />
  <rect x="12" y="11" width="2" height="3" fill="#ffffff" />
  <rect x="18" y="11" width="2" height="3" fill="#ffffff" />
  <rect x="14" y="13" width="4" height="2" fill="#ffffff" />
  <!-- Grip ridges at bottom -->
  <rect x="6" y="22" width="20" height="2" fill="#ffffff" />
  <rect x="6" y="25" width="20" height="2" fill="#ffffff" />
</svg>
